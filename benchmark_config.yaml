  # ── model 仓库模型（原生引擎通道，评测对比基线）──
  # Qwen 家族 — llama.cpp (GGUF, 阿里官方推荐端侧方案)
  - name: "qwen3-0.6b-native"
    family: "qwen"
    source: "Qwen/Qwen3-0.6B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "qwen3-0.6b-aria"

  - name: "qwen3-1.7b-native"
    family: "qwen"
    source: "Qwen/Qwen3-1.7B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "qwen3-1.7b-aria"

  - name: "qwen2.5-0.5b-native"
    family: "qwen"
    source: "Qwen/Qwen2.5-0.5B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "qwen2.5-0.5b-aria"

  - name: "qwen2.5-1.5b-native"
    family: "qwen"
    source: "Qwen/Qwen2.5-1.5B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "qwen2.5-1.5b-aria"

  # Gemma 家族 — llama.cpp (GGUF, Google 官方端侧支持)
  - name: "gemma3-1b-native"
    family: "gemma"
    source: "google/gemma-3-1b-it"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "gemma3-1b-aria"

  - name: "gemma3-4b-native"
    family: "gemma"
    source: "google/gemma-3-4b-it"
    engine: "llama_cpp"
