    max_context: 32768
    compare_with: "gemma3-4b-aria"

  - name: "gemma3-12b-native"
    family: "gemma"
    source: "google/gemma-3-12b-it"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
