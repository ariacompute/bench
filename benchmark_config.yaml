  - name: "gemma-2-2b-native"
    family: "gemma"
    source: "google/gemma-2-2b-it"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "gemma-2-2b-aria"

  - name: "gemma2-9b-native"
    family: "gemma"
    source: "google/gemma-2-9b-it"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "gemma2-9b-aria"

  # LFM 家族 — transformers (Liquid Neural Network, HF 原生支持)
  - name: "lfm-1b-native"
    family: "lfm"
    source: "LiquidAI/LFM2-350M"
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 32768
    compare_with: "lfm-1b-aria"

  - name: "lfm-3b-native"
    family: "lfm"
    source: "LiquidAI/LFM2-2.6B"
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 32768
    compare_with: "lfm-3b-aria"

  # Bonsai 家族 — llama.cpp (标准 Transformer LLM)
  - name: "bonsai-1.7b-native"
    family: "bonsai"
    source: "prism-ml/Bonsai-1.7B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "bonsai-1.7b-aria"

  # Inkling 家族 — llama.cpp (标准小型 LLM)
  - name: "inkling-native"
    family: "inkling"
    source: "thinkingmachines/Inkling-Small"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "inkling-aria"

  # LingBot 家族 — transformers (VLA 模型，需要特定架构)
  - name: "lingbot-native"
    family: "lingbot"
    source: "robbyant/lingbot-vla-v2-6b"
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 32768
    compare_with: "lingbot-aria"

  # Nanbeige 家族 — llama.cpp (标准中文 LLM)
  - name: "nanbeige-native"
    family: "nanbeige"
    source: "Nanbeige/Nanbeige4.2-3B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768
    compare_with: "nanbeige-aria"

  # OpenPI 家族 — transformers (VLA 模型, LeRobot pipeline)
  - name: "openpi-native"
    family: "openpi"
    source: "lerobot/pi0_base"
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 32768
    compare_with: "openpi-aria"

  # OpenVLA 家族 — transformers (VLA 模型, Prismatic 架构)
  - name: "openvla-native"
    family: "openvla"
    source: "openvla/openvla-7b"
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 32768
    compare_with: "openvla-aria"

  # ── 非仓库端侧模型（仅原生引擎通道） ──
  # MiniCPM — llama.cpp (OpenBMB 官方 GGUF 支持)
  - name: "minicpm3-4b-native"
    family: "minicpm"
    source: "openbmb/MiniCPM3-4B"
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768

  # DeepSeek — transformers (MLA 注意力，原生 HF 适配)
  - name: "deepseek-v2-lite-native"
    family: "deepseek"
    source: "deepseek-ai/DeepSeek-V2-Lite-Chat"
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 131072

  # Vlx-Seek — transformers (多模态 VLM)
  - name: "vlx-seek-native"
    family: "vlx_seek"
    source: "vlx-seek/vlx-seek-7b"  # 待确认 HF 路径
    engine: "transformers"
    quantizations: ["fp16", "int8"]
    max_context: 32768

  # Step-Edge — llama.cpp (StepFun 端侧 GGUF)
  - name: "step-edge-native"
    family: "step_edge"
    source: "stepfun-ai/Step-Edge-Chat"  # 待确认 HF 路径
    engine: "llama_cpp"
    quantizations: ["q4_k_m", "q8_0"]
    max_context: 32768

tasks:
  academic:
    - mmlu
    - gsm8k
    - ceval
    - humaneval
  longcontext:
    - needle_in_haystack:
        context_lengths: [4096, 8192, 16384, 32768, 65536, 131072]
        depth_percent: [0, 10, 20, 50, 80, 90, 100]
  instruction:
    - ifeval

hardware:
  targets:
    - name: "local"
      type: "x86-cpu"
      desc: "当前机器，Phase 3 唯一目标"

metrics:
  capability:
    - mmlu_acc
    - gsm8k_exact_match
    - ceval_acc
    - humaneval_pass_at_1
    - needle_accuracy
    - ifeval_strict_acc
  performance:
    - ttft_ms
    - tokens_per_second
    - peak_memory_mb
    - model_size_mb
    - power_watts

# ── 多引擎配置 ──
engines:
  aria:
    source: "https://github.com/ariacompute/engine"
    release: "latest"
    binary: "aria-engine"
    version: ">=0.1.0"
    timeout_seconds: 3600
    description: "Aria Hadamard+Lloyd-Max 量化引擎"
  llama_cpp:
    source: "https://github.com/ggerganov/llama.cpp"
    release: "latest"
    binary: "llama-cli"
    version: ">=b4000"
    timeout_seconds: 3600
    description: "llama.cpp GGUF 推理引擎"
  transformers:
    source: "https://github.com/huggingface/transformers"
    version: ">=4.40.0"
    timeout_seconds: 3600
    description: "HuggingFace Transformers 原生推理"

scoring:
  capability_weight: 0.40
  efficiency_weight: 0.25
  longcontext_weight: 0.10
  instruction_weight: 0.05
  multimodal_weight: 0.15   # 暂缺（MMMU 延后）
  deploy_weight: 0.05        # 暂缺
