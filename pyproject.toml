[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-bench"
version = "0.1.0"
description = "aria 端侧大模型综合评测平台"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bench = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/test_config.py" = ["E501"]
"tests/test_eval.py" = ["E501"]
"tests/test_env.py" = ["E501"]
"tests/test_perf.py" = ["E501"]
"tests/test_report.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
